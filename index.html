<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/studi-demo/vite.svg" />
    <!-- Keep this out of search results.
         The bundle carries ~900 questions and 282 figures transcribed from a
         published CAT prep book. This is a shared engineering demo, not a
         publication of that material, and it should not be indexed or scraped.

         The meta tag is the mechanism that actually works here: GitHub Pages
         serves a PROJECT site from /<repo>/, and crawlers read robots.txt from
         the domain root, which this repo does not control. Pages also cannot
         set an X-Robots-Tag header. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrepOS — CAT Quant Practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/studi-demo/assets/index-BJYmH42G.js"></script>
    <link rel="modulepreload" crossorigin href="/studi-demo/assets/react-B41xXmpQ.js">
    <link rel="modulepreload" crossorigin href="/studi-demo/assets/katex-jm46h7XH.js">
    <link rel="stylesheet" crossorigin href="/studi-demo/assets/katex-BOxnx1-i.css">
    <link rel="stylesheet" crossorigin href="/studi-demo/assets/index-DKmf1PGR.css">
  </head>
  <body>
    <!-- Theme before first paint.
         This has to be inline and synchronous. If the theme were set from React
         instead, the browser would paint the default stylesheet first and the
         page would flash white before going dark on every single load — the one
         bug a dark theme cannot have. Kept deliberately tiny and duplicated from
         src/theme.js rather than imported, because a module import is deferred
         and would reintroduce exactly the flash it is here to prevent. -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('studi.theme');
        } catch (e) {
          var stored = null;
        }
        document.documentElement.setAttribute(
          'data-theme',
          stored === 'light' || stored === 'dark' ? stored : 'dark'
        );
      })();
    </script>
    <div id="root"></div>
  </body>
</html>
